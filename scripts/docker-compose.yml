# Docker services for mebsuta integration tests
# Usage: docker compose -f scripts/docker-compose.yml up -d --wait
#
# SECURITY NOTE: This file contains hardcoded test credentials used exclusively
# for local integration testing. These containers should NEVER be exposed to
# production networks. In production, use a secrets manager or environment
# variable injection instead of hardcoded passwords.

services:
  mysql:
    image: mysql:8.4
    container_name: mebsuta-mysql
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_DATABASE: logs
      MYSQL_PWD: test
    ports:
      - "3306:3306"
    healthcheck:
      # Use MYSQL_PWD env var instead of -p flag to avoid exposing the password
      # in process listings (ps aux).
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root"]
      interval: 5s
      timeout: 10s
      retries: 10

  postgres:
    image: postgres:18-alpine
    container_name: mebsuta-postgres
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: logs
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d logs"]
      interval: 5s
      timeout: 5s
      retries: 10
