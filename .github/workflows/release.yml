name: Release

on:
  push:
    tags:
      - "go/v*"
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - name: Validate tag format
        run: |
          # 当前世系恒为 v0.1.<patch>-<rev>(H11:精确正则,拒绝旧世系
          # v0.8.0 之类——它们会被模块代理当作 @latest 误推荐)。
          if ! echo "$TAG_NAME" | grep -Eq '^v0\.1\.[0-9]+-[0-9]+$'; then
            echo "::error::Unexpected tag format: $TAG_NAME. Use v0.1.<patch>-<rev>." >&2
            exit 1
          fi

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: guard
    if: startsWith(github.ref_name, 'v') || startsWith(github.ref_name, 'go/v')
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -s -l .)"
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Validate Go module path
        run: |
          module_path="$(go list -m)"
          if [ "$module_path" != 'github.com/iuboy/mebsuta' ]; then
            echo "::error::Expected module path github.com/iuboy/mebsuta, got $module_path"
            exit 1
          fi

  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [guard, go]
    if: always()
    env:
      TAG_NAME: ${{ github.ref_name }}
      GO_RESULT: ${{ needs.go.result }}
    steps:
      - name: Report release status
        run: |
          echo "## Release Status" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Triggered | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|-----------|--------|" >> "$GITHUB_STEP_SUMMARY"
          case "$TAG_NAME" in
            go/v*|v*) echo "| go | yes | $GO_RESULT |" >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "| go | no | skipped |" >> "$GITHUB_STEP_SUMMARY" ;;
          esac
      - name: Fail if any triggered job failed
        run: |
          case "$TAG_NAME" in
            go/v*|v*)
              if [ "$GO_RESULT" = 'skipped' ]; then
                echo "::warning::go release job was skipped (tag may not match go filter)"
              elif [ "$GO_RESULT" != 'success' ]; then
                echo "::error::go release job failed (result: $GO_RESULT)"
                exit 1
              fi
              ;;
          esac

  github-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    needs: status
    if: needs.status.result == 'success'
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$TAG_NAME"
          # Release 说明取 CHANGELOG 对应小节(定版内容,而非占位文本)。
          NOTES=$(awk -v ver="## [$TAG" 'index($0, ver) == 1 {flag=1} flag && /^## \[/ && index($0, ver) != 1 {exit} flag {print}' CHANGELOG.md)
          gh release create "$TAG" --title "$TAG" --notes "$NOTES"
