name: Security Scan

# Weekly vulnerability sweep so stdlib/dependency CVEs surface between
# releases instead of at the next tag push (v0.8.0 shipped with three
# reachable stdlib CVEs discovered only at release time).
on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan
  cancel-in-progress: false

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: govulncheck (pinned to the release-gate version)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  gosec:
    # Static Go security analysis (Golang Security Checker): hardcoded
    # credentials, weak crypto, unhandled errors, file-permission issues, and
    # the other CWE classes govulncheck's dependency-CVE view cannot see.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: gosec security scan
        uses: securego/gosec@5eb1d104ef85ff2c905c877eb600e8c1dee33a22 # v2.30.0
        with:
          args: ./...

  gitleaks:
    # Secret scan over the full history: a leaked key that landed in any past
    # commit must surface here, not only when it reaches the working tree.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0 # full history so gitleaks scans commits, not just HEAD
      - name: gitleaks secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go-mod-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify module checksums
        run: go mod verify
      - name: Tidy check (no drifting go.sum)
        run: |
          cp go.sum go.sum.bak
          go mod tidy
          if ! diff -u go.sum.bak go.sum; then
            echo "::error::go.sum is not tidy — run go mod tidy and commit" >&2
            exit 1
          fi
