name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/go-checks.yml'

  # 检查集（test/vet/gofmt/staticcheck/vulncheck/integration）收敛在
  # go-checks.yml，与 dev 分支共用同一份定义。
  checks:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    uses: ./.github/workflows/go-checks.yml
    permissions:
      contents: read

  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, checks]
    if: always()
    env:
      GO_SEL: ${{ needs.changes.outputs.go }}
      CHECKS_RESULT: ${{ needs.checks.result }}
      CHANGES_RESULT: ${{ needs.changes.result }}
    steps:
      - name: Report selected jobs
        run: |
          echo "## CI Status Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Selected | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|----------|--------|" >> "$GITHUB_STEP_SUMMARY"
          if [ "$GO_SEL" = 'true' ]; then sel=yes; else sel=no; fi
          echo "| checks (go+vulncheck+integration) | $sel | $CHECKS_RESULT |" >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if any selected job failed
        run: |
          failed=0
          [ "$CHANGES_RESULT" = 'success' ] || { echo "::error::changes job failed"; failed=1; }
          if [ "$GO_SEL" = 'true' ]; then
            [ "$CHECKS_RESULT" = 'success' ] || { echo "::error::checks failed or was cancelled"; failed=1; }
          fi
          exit "$failed"
